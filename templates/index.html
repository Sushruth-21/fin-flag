{% extends 'layout.html' %}

{% block main %}

    <form action="/process_transaction" method="POST">
        <input type="number" name="user_id" placeholder="Enter User ID" required>
        <input type="number" step="0.01" name="amount" placeholder="Enter your amount">
        
        <button type="submit">Buy Now</button>
    </form>

    <form action="/csv" method="post" enctype="multipart/form-data">
        <label for="csv_upload">Upload Transaction Dataset (CSV): </label>
        <input accept=".csv" name="file" type="file" placeholder="Upload File">
        <button type="submit">Submit</button>
    </form>

{% endblock %}
